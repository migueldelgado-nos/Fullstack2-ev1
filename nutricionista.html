<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Nutricionista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/validaciones.js" defer></script>
</head>

<body>
    <header class="container">
        <div class="row">
            <div class="col">
                <h1>Panel del Nutricionista</h1>
                <p>Ficha del paciente</p>
            </div>

            <div class="col text-end">
                <button class="btn btn-secondary">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </header>


    <main class="container">
        <section class="row">
            <div class="col">
                <h2>Datos del paciente</h2>
                <form>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>
                        <input type="text" class="form-control" id="nombre">
                    </div>

                    <div class="mb-3">
                        <label for="edad" class="form-label">
                            Edad
                        </label>
                        <input type="number" class="form-control" id="edad">
                    </div>

                    <div class="mb-3">
                        <label for="sexo" class="form-label">
                            Sexo / Género
                        </label>
                        <select class="form-select" id="sexo">
                            <option selected>Seleccionar</option>
                            <option>Femenino</option>
                            <option>Masculino</option>
                            <option>Otro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="peso" class="form-label">
                            Peso (kg)
                        </label>
                        <input type="number" class="form-control" id="peso">
                    </div>

                    <div class="mb-3">
                        <label for="cintura" class="form-label">
                            Talla de cintura (cm)
                        </label>
                        <input type="number" class="form-control" id="cintura">
                    </div>

                    <div class="mb-3">
                        <label for="altura" class="form-label">
                            Altura (cm)
                        </label>
                        <input type="number" class="form-control" id="altura">
                    </div>

                    <div class="mb-3">
                        <label for="grasa" class="form-label">
                            Índice de grasa corporal (%)
                        </label>
                        <input type="number" class="form-control" id="grasa">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Guardar datos
                    </button>

                </form>
            </div>
        </section>

        <section class="row">
            <div class="col">
                <h2>Plan de alimentación</h2>
                <form>

                    <div class="mb-3">
                        <label for="desayuno" class="form-label">
                            Desayuno
                        </label>
                        <textarea class="form-control" id="desayuno" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="colacion1" class="form-label">
                            Colación
                        </label>
                        <textarea class="form-control" id="colacion1" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="almuerzo" class="form-label">
                            Almuerzo
                        </label>
                        <textarea class="form-control" id="almuerzo" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="colacion2" class="form-label">
                            Colación de la tarde
                        </label>
                        <textarea class="form-control" id="colacion2" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="cena" class="form-label">
                            Cena
                        </label>
                        <textarea class="form-control" id="cena" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="observaciones" class="form-label">
                            Observaciones
                        </label>
                        <textarea class="form-control" id="observaciones" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Guardar plan de alimentación
                    </button>

                </form>
            </div>
        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="container">
        <p>Clínica Nutricional</p>
    </footer>

</body>
</html>
