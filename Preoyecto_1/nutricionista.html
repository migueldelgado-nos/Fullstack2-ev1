<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Nutricionista</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/validaciones.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md">
            <div class="container">
                <div class="col">
                <h1>Panel del Nutricionista</h1>
                <p>Ficha del paciente</p>
                </div>

                <div class="col text-end">
                <button class="btn btn-secondary">
                    Cerrar sesión
                </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">

        <section class="row">
            <div class="col">

                <h2>Ficha del paciente</h2>

                <!-- SELECTOR -->
                <div class="mb-3">
                    <label for="tipoFormulario" class="form-label">
                        Seleccionar formulario
                    </label>

                    <select class="form-select" id="tipoFormulario">
                        <option value="datos">Datos del paciente</option>
                        <option value="alimentacion">Plan de alimentación</option>
                    </select>
                </div>


                <!-- FORMULARIO DATOS DEL PACIENTE -->
                <div id="formularioDatos" class="bg-light py-5">
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-12 col-md-8 col-lg-6">
                                <h2 class="text-center mb-4"> 
                                    Datos del paciente 
                                </h2>
                                <form
                                    id="formulario-datos" 
                                    class="border rounded 
                                    p-4 shadow bg-white" 
                                    novalidate
                                >
                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                        <label for="nombre" class="from-label">
                                            Nombre
                                        </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="text" id="nombre" class="from-control" >
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                        <label for="edad" class="form-label">
                                            Edad
                                        </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="text" id="edad" class="form-control">
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                        <label for="sexo" class="form-label">
                                            Sexo
                                        </label>
                                    </div>
                                    <div class="col-auto">
                                        <select class="form-select" id="sexo">
                                            <option value="">Seleccionar</option>
                                            <option value="femenino">Femenino</option>
                                            <option value="masculino">Masculino</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                        <label for="peso" class="form-label">
                                            Peso (kg)
                                        </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="number" class="form-control" id="peso">
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                    <label for="cintura" class="form-label">
                                        Talla de cintura (cm)
                                    </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="number" class="form-control" id="cintura">
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                    <label for="altura" class="form-label">
                                        Altura (cm)
                                    </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="number" class="form-control" id="altura">
                                    </div>
                                </div>

                                <div class="row g-3 align-items-center">
                                    <div class="col-auto">
                                        <label for="grasa" class="form-label">
                                            Índice de grasa corporal (%)
                                        </label>
                                    </div>
                                    <div class="col-auto">
                                        <input type="number" class="form-control" id="grasa">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Guardar datos
                                </button>
                                </form>
                                <div
                                    id="mensaje-resultado1"
                                    class="mt-4"
                                    role="alert"
                                >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- FORMULARIO PLAN DE ALIMENTACIÓN -->
                <div id="formularioAlimentacion" class="d-none">
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-12 col-md-8 col-lg-6">
                                <h3>Plan de alimentación</h3>
                                <form id="formulario-alimentacion" class="border rounded p-4 shadow bg-white" novalidate>

                                    <div class="mb-3">
                                        <div class="col-auto">
                                            <label for="desayuno" class="form-label">
                                                Desayuno
                                            </label>
                                        </div>

                                        <div class="col-auto">
                                            <textarea class="form-control" id="desayuno" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="col-auto"> 
                                            <label for="colacion1" class="form-label">
                                                Colación
                                            </label>
                                        </div>
                                        <div class="col-auto">
                                            <textarea class="form-control" id="colacion1" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="col-auto">
                                            <label for="almuerzo" class="form-label">
                                                Almuerzo
                                            </label>
                                        </div>
                                        <div class="col-auto">
                                            <textarea class="form-control" id="almuerzo" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="col-auto">
                                            <label for="colacion2" class="form-label">
                                                Colación de la tarde
                                            </label>
                                        </div>
                                        <div class="col-auto">
                                            <textarea class="form-control" id="colacion2" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="col-auto">
                                            <label for="cena" class="form-label">
                                                Cena
                                            </label>
                                        </div>
                                        <div class="col-auto">
                                            <textarea class="form-control" id="cena" rows="3"></textarea>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="col-auto">
                                            <label for="observaciones" class="form-label">
                                                Observaciones
                                            </label>
                                        </div>
                                        <div class="col-auto">
                                            <textarea class="form-control" id="observaciones" rows="4"></textarea>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary">
                                        Guardar plan de alimentación
                                    </button>
                                </form>
                                <div
                                    id="mensaje-resultado2"
                                    class="mt-4"
                                    role="alert"
                                >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Clínica Nutricional NutriVida</p>
    </footer>

</body>
</html>
