<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">

    <script src="js/validaciones2.js" defer></script>
</head>

<body class="pagina-registro">
    <header class="container">
        <h1>Registro de Usuario</h1>
        <nav class="menu">
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <main class="container">
        <section class="row">
            <div class="col">
                <h2>Datos personales</h2>
                <form id="formRegistro">
                    <div class="mb-3">
                        <label for="run" class="form-label">
                            RUN
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="run"
                            maxlength="9"
                            placeholder="Ej: 19011022K">
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label for="apellidos" class="form-label">
                            Apellidos
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="apellidos"
                            maxlength="100">
                    </div>

                    <div class="mb-3">

                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label for="fechaNacimiento" class="form-label">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="fechaNacimiento">
                    </div>

                    <div class="mb-3">
                        <label for="region" class="form-label">
                            Región
                        </label>

                        <select class="form-select" id="region">

                            <option selected>Seleccionar</option>
                            <option>Región de La Araucanía</option>
                            <option>Región del Biobío</option>
                            <option>Región de Los Ríos</option>
                            <option>Región Metropolitana</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="comuna" class="form-label">
                            Comuna
                        </label>

                        <select class="form-select" id="comuna">

                            <option selected>Seleccionar</option>
                            <option>Temuco</option>
                            <option>Padre Las Casas</option>
                            <option>Villarrica</option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label">
                            Dirección
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="direccion"
                            maxlength="300">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Registrarse
                    </button>
                    <p id="mensajeExito" class="mensaje-exito"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="container">

        <p>Clínica Nutricional NutriVida</p>

    </footer>
</body>
</html>
